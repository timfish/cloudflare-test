<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R2 latency test</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --accent: #0b62d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #ececec;
          --muted: #999;
          --line: #333;
          --accent: #5a9cff;
        }
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, sans-serif;
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
      }
      button {
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        color: #fff;
        font: inherit;
        margin: 0 8px 8px 0;
        padding: 8px 16px;
      }
      button:disabled {
        opacity: 0.5;
      }
      .muted {
        color: var(--muted);
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 4px 8px;
        text-align: right;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child,
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }
      textarea {
        background: var(--bg);
        border: 1px solid var(--line);
        box-sizing: border-box;
        color: var(--fg);
        font: 12px/1.4 ui-monospace, monospace;
        height: 200px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>R2 latency test</h1>
    <p class="muted">
      Times GETs from this browser to R2. Press Seed once per bucket, then Run. Run again on each device and network
      you care about, and copy the JSON at the end.
    </p>
    <p id="info" class="muted">Loading…</p>
    <button id="seed">Seed test objects</button>
    <button id="run">Run</button>
    <label><input id="quick" type="checkbox" /> Quick run (fewer repeats)</label>
    <p id="status"></p>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Path</th>
            <th>Test</th>
            <th>n</th>
            <th>Median ms</th>
            <th>p90 ms</th>
            <th>Min ms</th>
            <th>Max ms</th>
            <th>Extra</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <h2>Results as JSON</h2>
    <button id="copy">Copy JSON</button>
    <textarea id="json" readonly></textarea>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const status = (text) => ($("status").textContent = text);
      const now = () => performance.now();
      const round = (x) => Math.round(x * 10) / 10;
      let info;
      let meta = {};
      let results = [];
      let unique = 0;

      const smallKey = (i) => `latency/small-${String(i).padStart(3, "0")}.bin`;
      const sizeKey = (name) => `latency/size-${name}.bin`;
      const freshName = (name, i) => `${name}-${String(i).padStart(3, "0")}.bin`;
      // Must match FRESH in src/index.js.
      const FRESH = { small: 500, s64k: 10, s1m: 8, s8m: 4, r256k: 60 };
      const MB = 1024 * 1024;
      const randomOffset = (size, length) => Math.floor(Math.random() * ((size - length) / 4096)) * 4096;

      function stats(values) {
        const sorted = [...values].sort((a, b) => a - b);
        const at = (q) => sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
        return { n: sorted.length, p50: at(0.5), p90: at(0.9), min: sorted[0], max: sorted[sorted.length - 1] };
      }

      // One GET. HTTP and network errors come back as ok: false with the
      // status and the start of the body, so a test can count them.
      async function get(url, range) {
        const headers = range ? { range: `bytes=${range[0]}-${range[0] + range[1] - 1}` } : {};
        const started = now();
        try {
          const response = await fetch(url, { cache: "no-store", headers });
          const headersAt = now();
          const cache = response.headers.get("cf-cache-status");
          if (!response.ok) {
            const body = (await response.text()).slice(0, 300);
            return { ok: false, status: response.status, body, cache };
          }
          await response.arrayBuffer();
          return { ok: true, ttfb: headersAt - started, total: now() - started, cache };
        } catch (e) {
          return { ok: false, status: 0, body: String(e.message ?? e), cache: null };
        }
      }

      function protocolOf(url) {
        const entry = performance.getEntriesByName(new URL(url, location.href).href).pop();
        return entry?.nextHopProtocol || "protocol not shown";
      }

      // What one row of results collects.
      class Row {
        constructor(path, test, note = "") {
          Object.assign(this, { path, test, note, times: [], caches: [], errors: [] });
        }
        // Adds the responses of one timed step; `ms` counts only if all were ok.
        add(ms, responses) {
          for (const response of responses) {
            if (response.cache) this.caches.push(response.cache);
            if (!response.ok) this.errors.push({ status: response.status, body: response.body });
          }
          if (responses.every((response) => response.ok)) this.times.push(ms);
        }
        done() {
          const extra = [this.note];
          if (this.caches.length) {
            const counts = {};
            for (const c of this.caches) counts[c] = (counts[c] ?? 0) + 1;
            extra.push(Object.entries(counts).map(([c, n]) => `${c} ${n}/${this.caches.length}`).join(", "));
          }
          if (this.errors.length) {
            const counts = {};
            for (const e of this.errors) counts[e.status] = (counts[e.status] ?? 0) + 1;
            extra.push(`failed: ${Object.entries(counts).map(([c, n]) => `${c === "0" ? "network" : c} ×${n}`).join(", ")}`);
          }
          const s = this.times.length ? stats(this.times) : null;
          const row = {
            path: this.path,
            test: this.test,
            n: s?.n ?? 0,
            p50: s ? round(s.p50) : null,
            p90: s ? round(s.p90) : null,
            min: s ? round(s.min) : null,
            max: s ? round(s.max) : null,
            extra: extra.filter(Boolean).join("; "),
          };
          if (this.errors.length) {
            const seen = new Set();
            row.errors = this.errors.filter((e) => !seen.has(e.status + e.body) && seen.add(e.status + e.body)).slice(0, 3);
          }
          results.push(row);
          const tr = document.createElement("tr");
          for (const cell of [row.path, row.test, row.n, row.p50, row.p90, row.min, row.max, row.extra]) {
            const td = document.createElement("td");
            td.textContent = cell ?? "–";
            tr.append(td);
          }
          $("rows").append(tr);
          $("json").value = JSON.stringify({ meta, results }, null, 2);
          return this;
        }
      }

      // Times `count` steps of `step`, which returns the responses of one step.
      async function timed(row, count, step) {
        for (let i = 0; i < count; i++) {
          const started = now();
          const responses = await step(i);
          row.add(now() - started, responses);
        }
        return row.done();
      }

      // The test set for one path. `keys` names the objects each test reads.
      async function runTests(name, url, keys, repeats, options = {}) {
        const r = (n) => Math.max(3, Math.round(n * repeats));

        status(`${name}: first request`);
        const firstUrl = url(keys.small(0));
        const first = await get(firstUrl);
        const firstRow = new Row(name, "first GET on this page, 4 KB (to headers)", `includes connection setup, ${protocolOf(firstUrl)}`);
        firstRow.add(first.ttfb, [first]);
        firstRow.done();

        status(`${name}: 4 KB GETs one at a time`);
        const ttfb = new Row(name, "4 KB GET, to headers");
        const r2 = new Row(name, "4 KB GET, Worker to R2 only", "Server-Timing");
        for (let i = 0; i < r(20); i++) {
          const u = url(keys.small(1 + i));
          const result = await get(u);
          ttfb.add(result.ttfb, [result]);
          if (options.serverTiming && result.ok) {
            const entry = performance.getEntriesByName(new URL(u, location.href).href).pop();
            const ms = entry?.serverTiming?.find((t) => t.name === "r2")?.duration;
            if (ms !== undefined) r2.add(ms, [result]);
          }
        }
        ttfb.done();
        if (r2.times.length) r2.done();

        for (const [size, bytes, count] of [
          ["64k", 64 * 1024, 10],
          ["1m", MB, 8],
          ["8m", 8 * MB, 4],
        ]) {
          status(`${name}: ${size} GETs`);
          const row = new Row(name, `${size} GET, to last byte`);
          await timed(row, r(count), async (i) => [await get(url(keys.sized(size, i)))]);
          if (row.times.length) {
            const mbps = (bytes / 1e6 / (stats(row.times).p50 / 1000)).toFixed(1);
            const last = results[results.length - 1];
            last.extra = [last.extra, `${mbps} MB/s at median`].filter(Boolean).join("; ");
            $("json").value = JSON.stringify({ meta, results }, null, 2);
          }
        }

        status(`${name}: range GETs`);
        if (keys.warmRange) await get(url(keys.range(0)), [0, 65536]);
        await timed(new Row(name, `64 KB range of a ${keys.rangeLabel} object`), r(20), async (i) => [
          await get(url(keys.range(i)), [randomOffset(keys.rangeSize, 65536), 65536]),
        ]);

        let next = 100;
        for (const count of keys.parallel) {
          status(`${name}: ${count} GETs at once`);
          await timed(new Row(name, `${count} × 4 KB GETs at once, all done`), count === 250 ? 1 : r(3), async () =>
            Promise.all(Array.from({ length: count }, () => get(url(keys.small(next++))))),
          );
        }

        status(`${name}: redraw shape`);
        let rangeNext = 20;
        await timed(
          new Row(name, "redraw: 4 KB GET, then 4 × 64 KB ranges at once", "two round trips"),
          r(10),
          async (i) => {
            const firstHop = await get(url(keys.small(30 + i)));
            const ranges = await Promise.all(
              Array.from({ length: 4 }, () => get(url(keys.range(rangeNext++)), [randomOffset(keys.rangeSize, 65536), 65536])),
            );
            return [firstHop, ...ranges];
          },
        );
      }

      // The shared objects from Seed. Reads repeat, so a cache could serve them.
      const sharedKeys = {
        small: (i) => smallKey(i % 250),
        sized: (size) => sizeKey(size),
        range: () => sizeKey("8m"),
        rangeSize: 8 * MB,
        rangeLabel: "8 MB",
        warmRange: true,
        parallel: [1, 4, 10, 50, 250],
      };

      // A fresh set: every read is the first read of its object.
      function freshKeys(set) {
        const at = (name, i) => `latency/${set}/${freshName(name, i)}`;
        return {
          small: (i) => at("small", i),
          sized: (size, i) => at(`s${size}`, i),
          range: (i) => at("r256k", i),
          rangeSize: 256 * 1024,
          rangeLabel: "256 KB",
          warmRange: false,
          parallel: [4, 10, 50],
        };
      }

      async function directUrls(keys) {
        const urls = {};
        for (let i = 0; i < keys.length; i += 50) {
          const query = keys.slice(i, i + 50).map((k) => `key=${encodeURIComponent(k)}`).join("&");
          const body = await (await fetch(`/presign?${query}`, { cache: "no-store" })).json();
          if (body.error) throw new Error(body.error);
          Object.assign(urls, body.urls);
        }
        return (key) => urls[key];
      }

      async function seedSet(set) {
        for (let batch = 0; ; batch++) {
          status(`Writing objects (${set}), batch ${batch + 1}`);
          const body = await (await fetch(`/seed?set=${set}&batch=${batch}`, { method: "POST" })).json();
          if (body.error) throw new Error(body.error);
          if (body.done) return;
        }
      }

      async function runCached(repeats) {
        const name = "public, cache hit";
        const base = info.publicBase.replace(/\/$/, "");
        const url = (key) => `${base}/${key}`;
        const r = (n) => Math.max(3, Math.round(n * repeats));

        status(`${name}: filling the cache`);
        const warm = [sizeKey("1m"), sizeKey("8m")];
        for (let i = 0; i < 50; i++) warm.push(smallKey(i));
        for (const key of warm) await get(url(key));
        for (const key of warm) await get(url(key));

        const ttfb = new Row(name, "4 KB GET, to headers", protocolOf(url(smallKey(0))));
        for (let i = 0; i < r(20); i++) {
          const result = await get(url(smallKey(i % 50)));
          ttfb.add(result.ttfb, [result]);
        }
        ttfb.done();
        await timed(new Row(name, "1m GET, to last byte"), r(8), async () => [await get(url(sizeKey("1m")))]);
        await timed(new Row(name, "64 KB range of an 8 MB object"), r(20), async () => [
          await get(url(sizeKey("8m")), [randomOffset(8 * MB, 65536), 65536]),
        ]);
        for (const count of [4, 10, 50]) {
          await timed(new Row(name, `${count} × 4 KB GETs at once, all done`), r(5), async () =>
            Promise.all(Array.from({ length: count }, (_, k) => get(url(smallKey(k))))),
          );
        }
        await timed(new Row(name, "redraw: 4 KB GET, then 4 × 64 KB ranges at once", "two round trips"), r(10), async (i) => {
          const firstHop = await get(url(smallKey(i % 50)));
          const ranges = await Promise.all(
            Array.from({ length: 4 }, () => get(url(sizeKey("8m")), [randomOffset(8 * MB, 65536), 65536])),
          );
          return [firstHop, ...ranges];
        });
      }

      async function run() {
        $("run").disabled = $("seed").disabled = true;
        results = [];
        $("rows").replaceChildren();
        const repeats = $("quick").checked ? 0.3 : 1;
        meta = {
          date: new Date().toISOString(),
          userAgent: navigator.userAgent,
          connection: navigator.connection
            ? { effectiveType: navigator.connection.effectiveType, rttMs: navigator.connection.rtt, downlinkMbps: navigator.connection.downlink }
            : null,
          workerColo: info.colo,
          country: info.country,
          httpProtocol: info.httpProtocol,
        };
        const failed = [];
        const attempt = async (name, work) => {
          try {
            await work();
          } catch (e) {
            failed.push(`${name}: ${e.message}`);
            results.push({ path: name, test: "stopped", error: e.message });
            $("json").value = JSON.stringify({ meta, results }, null, 2);
          }
        };

        await attempt("worker", async () => {
          status("ping: round trip to the Worker, no R2");
          await timed(new Row("worker", "ping, no R2", "browser to Cloudflare edge"), 20, async () => {
            const started = now();
            await (await fetch(`/ping?u=${unique++}`, { cache: "no-store" })).arrayBuffer();
            return [{ ok: true, total: now() - started }];
          });
          await runTests("worker", (key) => `/obj/${key}?u=${unique++}`, sharedKeys, repeats, { serverTiming: true });
        });
        if (info.presign) {
          await attempt("direct", async () => {
            const url = await directUrls(info.keys);
            await runTests("direct", url, sharedKeys, repeats);
          });
        }
        if (info.publicBase) {
          const base = info.publicBase.replace(/\/$/, "");
          await attempt("public, cache miss", async () => {
            const set = `fresh-${Date.now().toString(36)}`;
            await seedSet(set);
            await runTests("public, cache miss", (key) => `${base}/${key}`, freshKeys(set), repeats);
          });
          await attempt("public, cache hit", () => runCached(repeats));
        }
        status(failed.length ? `Done, but stopped early on: ${failed.join("; ")}` : "Done. Copy the JSON below.");
        $("run").disabled = $("seed").disabled = false;
      }

      async function seed() {
        $("run").disabled = $("seed").disabled = true;
        try {
          await seedSet("base");
          status("Seeded. Press Run.");
        } catch (e) {
          status(`Seed failed: ${e.message}`);
        } finally {
          $("run").disabled = $("seed").disabled = false;
        }
      }

      $("seed").onclick = seed;
      $("run").onclick = run;
      $("copy").onclick = () => navigator.clipboard.writeText($("json").value);

      info = await (await fetch("/info", { cache: "no-store" })).json();
      $("info").textContent =
        `Worker at Cloudflare location ${info.colo} (${info.country}), ${info.httpProtocol}. Bucket ${info.bucket}. ` +
        `Paths: worker${info.presign ? ", direct (presigned)" : " (direct path off: R2 secrets not set)"}` +
        `${info.publicBase ? ", public (cache miss and cache hit)" : ""}.`;
    </script>
  </body>
</html>
